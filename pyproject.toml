[project]
name = "eco-planner"
version = "0.1.0"
description = "Energy-aware diffusion planning in MetaDrive with DPPO fine-tuning."
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "fastsim",
    "gymnasium",
    "hydra-core",
    "lightning",
    "metadrive-simulator",
    "numpy",
    "omegaconf",
    "timm",
    "torchrl==0.12.0",
]

[project.optional-dependencies]
cpu = [
    "torch==2.6.0",
]

cuda = [
    "torch==2.6.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
metadrive-simulator = { path = "third_party/metadrive", editable = true }

torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
