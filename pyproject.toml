[project]
name = "eco-planner"
version = "0.1.0"
description = "Energy-aware diffusion planning in MetaDrive with DPPO fine-tuning."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastsim",
    "gymnasium",
    "hydra-core",
    "lightning",
    "metadrive-simulator",
    "numpy",
    "omegaconf",
    "timm",
    "torch==2.6.0+cu124",
    #"torchvision==0.28.0+cu124",
    "torchrl==0.12.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
metadrive-simulator = { path = "third_party/metadrive", editable = true }
torch = { path = "C:/Users/x30085685/Downloads/torch-2.6.0+cu124-cp310-cp310-win_amd64.whl" }


[tool.uv]
allow-insecure-host = ["cmc-cd-mirror.rnd.huawei.com"]

[[tool.uv.index]]
name = "internal"
url = "http://cmc-cd-mirror.rnd.huawei.com/pypi/simple/"
default = true


[tool.hatch.build.targets.wheel]
packages = ["src/eco_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "gpu: requires a CUDA GPU",
    "simulator: requires MetaDrive and its simulator runtime",
    "slow: long-running integration or evaluation test",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["third_party/**", "ref/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
