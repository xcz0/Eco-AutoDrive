[project]
name = "eco-planner"
version = "0.1.0"
description = "Energy-aware diffusion planning in MetaDrive with DPPO fine-tuning."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastsim>=3.0,<4",
    "gymnasium>=1.0,<2",
    "hydra-core>=1.3,<2",
    "lightning>=2.5,<3",
    "metadrive",
    "numpy>=1.26,<3",
    "omegaconf>=2.3,<3",
    "torch>=2.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
metadrive = { path = "third_party/metadrive", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/eco_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: requires a CUDA GPU",
    "simulator: requires MetaDrive and its simulator runtime",
    "slow: long-running integration or evaluation test",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
