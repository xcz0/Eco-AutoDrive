[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eco-planner"
version = "0.1.0"
description = "Energy-aware diffusion planning in MetaDrive with RL fine-tuning."
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "diffusers",
    "fastsim",
    "gymnasium",
    "hydra-core",
    "hydra-joblib-launcher",
    "lightning",
    "metadrive-simulator",
    "numpy",
    "omegaconf",
    "pydantic",
    "shapely",
    "timm",
    "torch==2.12.1",
    "tensordict==0.13.0",
    "torchrl==0.13.3",
    "jaxtyping",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv.sources]
metadrive-simulator = { path = "third_party/metadrive", editable = true }
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "-m",
    "not gpu and not simulator and not slow",
]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
strict_markers = true
xfail_strict = true
markers = [
    "gpu: requires a CUDA-capable PyTorch runtime and GPU",
    "simulator: requires the local MetaDrive runtime and assets",
    "slow: exercises checkpoints or otherwise long-running behavior",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party", "ref"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = [
    "src/eco_planner/envs/contracts.py",
    "src/eco_planner/envs/domain",
    "src/eco_planner/envs/observation",
    "src/eco_planner/envs/runtime/slot.py",
]
exclude = ["third_party", "ref"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.hatch.build.targets.wheel]
packages = ["src/eco_planner"]
