# @package _global_

defaults:
  - /env: metadrive
  - /model: diffusion_planner
  - /runtime: fabric
  - /sampler: ddim5
  - /guidance: orthogonal_policy
  - /policy: exploration_beta
  - _self_

name: plannerrft_stage4_rollout_smoke
map_query_radius_m: 100.0

rollout:
  mode: no_traffic
  max_transitions: 4
  history_warmup_steps: 0
  transition_dt_s: 0.1
  policy_action_seed: 1
  reward_source: metadrive_builtin_v1
  bootstrap_time_limit: true
  candidate_count: 1

env:
  num_scenarios: 1
  use_render: false
  image_observation: false
  traffic_density: 0.0
  random_traffic: false
  random_spawn_lane_index: false
  accident_prob: 0.0
  physics_world_step_size: 0.02
  decision_repeat: 5
  trajectory_horizon: 80
  trajectory_execution_steps: 1
  programmatic_lane_speed_limit_kmh: 50.0
  horizon: 4

model:
  args_path: checkpoints/DP-Origin/args.json
  checkpoint_path: checkpoints/DP-Origin/model.pth

runtime:
  seed: 0

scenario:
  name: straight
  map: S
  seed: 0
