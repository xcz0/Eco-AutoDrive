version: 1

energy_metric:
  name: metadrive_fuel_proxy
  implementation: recompute_metadrive_base_vehicle_formula_on_executed_trace
  formula: 3.25 * exp(0.01 * speed_kmh) * distance_km / 100 * 1000
  unit: mL
  sampling_interval_s: 0.1
  interpretation: MetaDrive fuel-consumption proxy, not physical vehicle energy

guidance_profiles:
  - id: baseline
    config: none
    longitudinal_scale: null
  - id: longitudinal_negative
    config: energy_longitudinal_negative
    longitudinal_scale: -1.0
  - id: longitudinal_zero
    config: orthogonal_reference
    longitudinal_scale: 0.0
  - id: longitudinal_positive
    config: energy_longitudinal_positive
    longitudinal_scale: 1.0

jobs:
  - id: structures
    config_name: studies/energy/evaluation/structures
  - id: speed_limit
    config_name: studies/energy/evaluation/speed_profile
  - id: traffic_follow
    config_name: studies/energy/evaluation/traffic
