version: 2
base_training_config: jobs/training/ppo/smoke

# Phase B keeps the same ordered reward pair as the Phase A mechanical gate.
profiles:
  - {id: builtin, reward_config: metadrive_builtin_v1}
  - {id: energy, reward_config: plannerrft_energy_v1}

matched_training:
  # 20 updates × 8 optimizer steps/update for the current PPO component.
  update_count: 20
  transitions_per_environment: 16
  scheduler_total_optimizer_steps: 160
  training_seeds: [0, 1, 2]
  replay_ids: [0]
  scenarios:
    - {name: straight, map: S, seed: 0}
    - {name: gentle_curve, map: SC, seed: 0}

# Review-only thresholds. They flag regressions but never claim energy improvement automatically.
review_thresholds:
  longitudinal_action_mean_deadband: 0.01
  energy_intensity_deadband_fraction: 0.01
  maximum_progress_drop_fraction: 0.20
  maximum_mean_speed_drop_fraction: 0.20
  maximum_collision_count_increase: 0
  maximum_out_of_road_count_increase: 0
