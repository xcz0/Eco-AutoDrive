# @package _global_

defaults:
  - /components/env
  - /components/model
  - /components/runtime
  - /components/resources: null
  - /components/video
  - /components/sampler: dpm10
  - /components/guidance: none
  - _self_

map_query_radius_m: 100.0

evaluation:
  execution:
    mode: serial
    vector_env_slots: ${oc.select:resources.evaluation_vector_env_slots,null}
    torch_threads_per_worker: ${oc.select:resources.torch_threads_per_worker,null}
    deterministic: false

runtime:
  seed: 0

video:
  enabled: false

hydra:
  job:
    chdir: false
