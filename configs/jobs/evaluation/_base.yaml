# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /resources: ${oc.env:MACHINE_NAME}
  - /video: default
  - /planner/sampler: dpm10
  - /planner/guidance: none
  - _self_

map_query_radius_m: 100.0

evaluation:
  execution:
    mode: serial
    vector_env_slots: ${resources.evaluation_vector_env_slots}
    torch_threads_per_worker: ${resources.torch_threads_per_worker}
    deterministic: false

runtime:
  seed: 0

video:
  enabled: false

hydra:
  job:
    chdir: false
