# @package _global_

# Issue #81 Task B: matched held-out evaluation for trained exploration-policy
# checkpoints (A1/A2 arms). Scenarios, runtime seed, sampler, and horizon are
# identical to jobs/evaluation/no_traffic_heldout; actions come from the loaded
# checkpoint's deterministic Beta mean, so the diffusion noise stream matches
# the A0 arm. evaluation.policy_checkpoint.{label,path} are required overrides.

defaults:
  - /components/evaluation
  - /components/policy
  - override /components/sampler: ddim5
  - override /components/guidance: orthogonal_policy
  - _self_

name: matched_no_traffic_heldout_policy

evaluation:
  mode: no_traffic
  profile: full
  history_warmup_steps: 0
  evaluated_horizon_steps: 300
  policy_checkpoint:
    label: ???
    path: ???

env:
  horizon: 300
  # MetaDrive treats the scenario seed as an index into [0, num_scenarios);
  # the held-out pool must cover map seed 23.
  num_scenarios: 24

runtime:
  seed: 760025

scenarios:
  - {name: s16, map: S, seed: 16}
  - {name: s17, map: S, seed: 17}
  - {name: s18, map: S, seed: 18}
  - {name: s19, map: S, seed: 19}
  - {name: s20, map: S, seed: 20}
  - {name: s21, map: S, seed: 21}
  - {name: s22, map: S, seed: 22}
  - {name: s23, map: S, seed: 23}
  - {name: sc16, map: SC, seed: 16}
  - {name: sc17, map: SC, seed: 17}
  - {name: sc18, map: SC, seed: 18}
  - {name: sc19, map: SC, seed: 19}
  - {name: sc20, map: SC, seed: 20}
  - {name: sc21, map: SC, seed: 21}
  - {name: sc22, map: SC, seed: 22}
  - {name: sc23, map: SC, seed: 23}

hydra:
  run:
    dir: outputs/evaluation/held-out-policy/${now:%Y-%m-%d}/${now:%H-%M-%S}-label-${evaluation.policy_checkpoint.label}
