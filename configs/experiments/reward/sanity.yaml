version: 1
reward_config: configs/components/reward/plannerrft_energy_v1.yaml

base_input:
  previous_position_xy_m: [0.0, 0.0]
  position_xy_m: [1.0, 0.0]
  previous_velocity_xy_mps: [10.0, 0.0]
  velocity_xy_mps: [10.0, 0.0]
  previous_acceleration_xy_mps2: [0.0, 0.0]
  heading_rad: 0.0
  yaw_rate_radps: 0.0
  route_progress_delta_m: 1.0
  route_heading_rad: 0.0
  speed_limit_mps: 13.88888888888889
  ego_width_m: 2.0
  ego_length_m: 4.0
  participants: []
  static_objects: []
  crash_vehicle: false
  crash_object: false
  crash_building: false
  crash_human: false
  crash_sidewalk: false
  out_of_road: false
  native_step_energy_ml: 0.0
  native_episode_energy_ml: 0.0
  timestep_s: 0.1

cases:
  - name: cruise
    overrides: {}
    numeric_expectations:
      - {field: reward_gate, value: 1.0, absolute_tolerance: 0.0}
      - {field: ttc_score, value: 1.0, absolute_tolerance: 0.0}
      - {field: progress_score, value: 1.0, absolute_tolerance: 0.0}
      - {field: comfort_score, value: 1.0, absolute_tolerance: 0.0}
      - {field: speed_score, value: 1.0, absolute_tolerance: 0.0}
    boolean_expectations:
      - {field: energy_distance_valid, value: true}
      - {field: has_ttc_candidate, value: false}

  - name: stationary
    overrides:
      position_xy_m: [0.0, 0.0]
      previous_velocity_xy_mps: [0.0, 0.0]
      velocity_xy_mps: [0.0, 0.0]
      route_progress_delta_m: 0.0
    numeric_expectations:
      - {field: progress_score, value: 0.0, absolute_tolerance: 0.0}
      - {field: energy_score, value: 0.0, absolute_tolerance: 0.0}
    boolean_expectations:
      - {field: energy_distance_valid, value: false}

  - name: extremely_low_speed
    overrides:
      position_xy_m: [0.005, 0.0]
      previous_velocity_xy_mps: [0.05, 0.0]
      velocity_xy_mps: [0.05, 0.0]
      route_progress_delta_m: 0.005
    numeric_expectations:
      - {field: energy_score, value: 0.0, absolute_tolerance: 0.0}
    boolean_expectations:
      - {field: energy_distance_valid, value: false}

  - name: slower_progress
    overrides:
      position_xy_m: [0.5, 0.0]
      previous_velocity_xy_mps: [5.0, 0.0]
      velocity_xy_mps: [5.0, 0.0]
      route_progress_delta_m: 0.5
    numeric_expectations:
      - {field: progress_score, value: 0.5, absolute_tolerance: 1.0e-12}
    boolean_expectations: []

  - name: low_route_progress
    overrides:
      route_progress_delta_m: 0.1
    numeric_expectations:
      - {field: progress_score, value: 0.1, absolute_tolerance: 1.0e-12}
    boolean_expectations: []

  - name: overspeed
    overrides:
      position_xy_m: [1.888888888888889, 0.0]
      previous_velocity_xy_mps: [18.88888888888889, 0.0]
      velocity_xy_mps: [18.88888888888889, 0.0]
    numeric_expectations:
      - {field: speed_score, value: 0.0, absolute_tolerance: 1.0e-12}
    boolean_expectations: []

  - name: following_non_closing
    overrides:
      participants:
        - object_id: lead
          kind: vehicle
          position_xy_m: [20.0, 0.0]
          heading_rad: 0.0
          velocity_xy_mps: [10.0, 0.0]
          width_m: 2.0
          length_m: 4.0
    numeric_expectations:
      - {field: ttc_score, value: 1.0, absolute_tolerance: 0.0}
      - {field: min_ttc_s, value: 10.0, absolute_tolerance: 0.0}
    boolean_expectations:
      - {field: has_ttc_candidate, value: false}

  - name: approaching_collision
    overrides:
      participants:
        - object_id: lead
          kind: vehicle
          position_xy_m: [8.0, 0.0]
          heading_rad: 0.0
          velocity_xy_mps: [5.0, 0.0]
          width_m: 2.0
          length_m: 4.0
    numeric_expectations:
      - {field: ttc_score, value: 0.0, absolute_tolerance: 0.0}
      - {field: min_ttc_s, value: 0.5, absolute_tolerance: 1.0e-12}
    boolean_expectations:
      - {field: has_ttc_candidate, value: true}

  - name: uncomfortable
    overrides:
      position_xy_m: [1.04, 0.0]
      velocity_xy_mps: [10.4, 0.0]
    numeric_expectations:
      - {field: comfort_score, value: 0.0, absolute_tolerance: 0.0}
    boolean_expectations: []

  - name: collision
    overrides: {crash_vehicle: true}
    numeric_expectations:
      - {field: collision_score, value: 0.0, absolute_tolerance: 0.0}
      - {field: reward_total, value: 0.0, absolute_tolerance: 0.0}
    boolean_expectations: []

  - name: out_of_road
    overrides: {out_of_road: true}
    numeric_expectations:
      - {field: drivable_score, value: 0.0, absolute_tolerance: 0.0}
      - {field: reward_total, value: 0.0, absolute_tolerance: 0.0}
    boolean_expectations: []

  - name: wrong_direction
    overrides: {heading_rad: 3.141592653589793}
    numeric_expectations:
      - {field: wrong_direction_score, value: 0.0, absolute_tolerance: 0.0}
      - {field: reward_total, value: 0.0, absolute_tolerance: 0.0}
    boolean_expectations: []

comparisons:
  - {left_case: cruise, left_field: reward_total, relation: greater_than, right_case: stationary, right_field: reward_total, minimum_difference: 0.0}
  - {left_case: cruise, left_field: reward_total, relation: greater_than, right_case: extremely_low_speed, right_field: reward_total, minimum_difference: 0.0}
  - {left_case: cruise, left_field: reward_total, relation: greater_than, right_case: slower_progress, right_field: reward_total, minimum_difference: 0.0}
  - {left_case: cruise, left_field: reward_total, relation: greater_than, right_case: low_route_progress, right_field: reward_total, minimum_difference: 0.0}
  - {left_case: cruise, left_field: reward_total, relation: greater_than, right_case: overspeed, right_field: reward_total, minimum_difference: 0.0}
  - {left_case: following_non_closing, left_field: ttc_score, relation: greater_than, right_case: approaching_collision, right_field: ttc_score, minimum_difference: 0.0}
  - {left_case: cruise, left_field: comfort_score, relation: greater_than, right_case: uncomfortable, right_field: comfort_score, minimum_difference: 0.0}
