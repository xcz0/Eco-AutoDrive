# Issue #114 Task 4 candidate provenance revalidation protocol (E-058).
#
# Revalidates the #106/E-055 lambda dose-response nomination under the ADR 0040
# Beta interior policy family and the Issue #114 Task 1 scheduler-matched
# 100-update contract: canonical k=5 (0.1 s x 5 = 0.5 s decision interval), the
# E-052 frozen PPO control overrides and the E-054 held-out evaluation
# contract, with the E-034 calibrated no-energy profile as lambda=0 (arm r0).
# The training/evaluation/bootstrap blocks are copied verbatim from
# calibrated-canonical-confirmation.yaml (E-056/E-057) so that the E-057
# r0/lam4/lam8 runs (seeds {0,1,2}, 100 updates, T_max=100) are reused as
# matched conditions; only lam1/lam2 are newly trained. Only the energy-band
# weight lambda varies between trained arms; every other training and
# evaluation parameter is shared. gradient_diagnostics is enabled
# (measurement only).
version: 1
study_name: canonical_candidate_revalidation
training:
  base_job: jobs/training/ppo_conservative
  maps:
  - S
  - SC
  map_seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  seeds:
  - 0
  - 1
  - 2
  overrides:
  - components/resources=rtx_a4000
  - ppo.target_kl=0.006
  - ppo.batch_size=128
  - training.transitions_per_environment=8
  - training.update_count=100
  - ppo.learning_rate=0.00015
  - ppo.epochs=1
  - ppo.max_gradient_norm=0.5
  - ppo.scheduler_total_optimizer_steps=100
  - ppo.value_coefficient=0.1
  - ppo.gamma=0.9509900499000001
  - ppo.gae_lambda=0.7737809375
  - ppo.gradient_diagnostics=true
arms:
  r0:
    label: ppo_plannerrft_r0_calibrated
    reward_profile: plannerrft_no_energy_calibrated_v1
  lam1:
    label: ppo_plannerrft_band_energy_lam1
    reward_profile: plannerrft_energy_band_lam1_v1
  lam2:
    label: ppo_plannerrft_band_energy_lam2
    reward_profile: plannerrft_energy_band_lam2_v1
  lam4:
    label: ppo_plannerrft_band_energy_lam4
    reward_profile: plannerrft_energy_band_lam4_v1
  lam8:
    label: ppo_plannerrft_band_energy_lam8
    reward_profile: plannerrft_energy_band_lam8_v1
evaluation:
  job: jobs/evaluation/no_traffic_heldout
  policy_job: jobs/evaluation/no_traffic_heldout_policy
  maps:
  - S
  - SC
  map_seeds:
  - 16
  - 17
  - 18
  - 19
  - 20
  - 21
  - 22
  - 23
  seed: 760025
  horizon_steps: 300
  sampler: ddim5
bootstrap:
  confidence_level: 0.95
  n_resamples: 10000
  bootstrap_seed: 0
contrasts:
- - r0
  - lam1
- - r0
  - lam2
- - r0
  - lam4
- - r0
  - lam8
