# Issue #83 Task 3 final A0/A1/A2 matched evaluation protocol (E-060).
#
# Final matched comparison of the frozen-planner baseline (A0) against the
# calibrated R0 learned-policy arm (A1) and the E-058/E-059 confirmed
# lambda=1 energy-band candidate (A2) under the frozen canonical contract:
# canonical k=5 (0.1 s x 5 = 0.5 s decision interval), the E-052 frozen PPO
# control overrides, the Issue #114 Task 1 scheduler-matched 100-update
# schedule and the E-054 held-out evaluation contract. The
# training/evaluation/bootstrap blocks are copied verbatim from
# calibrated-canonical-lam1-confirmation.yaml (E-059, itself verbatim from
# E-058) so that the E-057 r0 and E-058 lam1 training runs and held-out
# evaluations are reused as matched conditions under the renamed arms
# a1 = calibrated R0 and a2 = lambda=1. A0 is the only frozen arm
# (reward_profile: null, jobs/evaluation/no_traffic_heldout, no policy
# checkpoint) and is rerun on the final clean commit instead of reusing the
# E-029 historical artifact schema. Contrasts produce the pre-registered
# effects a1-a0 (learned behavioral effect, reported without direction
# criteria) and a2-a1 (Gate F primary adjudication). Main evaluation is the
# deterministic Beta mean; fixed policy-action-seed stochastic evaluation is
# auxiliary diagnostics only and does not enter Gate F.
# Pre-registered margins: docs/research/issue83-task-2-final-evaluation-margins-plan.md.
version: 1
study_name: canonical_final_a0_a1_a2_comparison
training:
  base_job: jobs/training/ppo_conservative
  maps:
  - S
  - SC
  map_seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  seeds:
  - 0
  - 1
  - 2
  overrides:
  - components/resources=rtx_a4000
  - ppo.target_kl=0.006
  - ppo.batch_size=128
  - training.transitions_per_environment=8
  - training.update_count=100
  - ppo.learning_rate=0.00015
  - ppo.epochs=1
  - ppo.max_gradient_norm=0.5
  - ppo.scheduler_total_optimizer_steps=100
  - ppo.value_coefficient=0.1
  - ppo.gamma=0.9509900499000001
  - ppo.gae_lambda=0.7737809375
  - ppo.gradient_diagnostics=true
arms:
  a0:
    label: frozen_diffusion_planner
    reward_profile: null
  a1:
    label: ppo_plannerrft_r0_calibrated
    reward_profile: plannerrft_no_energy_calibrated_v1
  a2:
    label: ppo_plannerrft_band_energy_lam1
    reward_profile: plannerrft_energy_band_lam1_v1
evaluation:
  job: jobs/evaluation/no_traffic_heldout
  policy_job: jobs/evaluation/no_traffic_heldout_policy
  maps:
  - S
  - SC
  map_seeds:
  - 16
  - 17
  - 18
  - 19
  - 20
  - 21
  - 22
  - 23
  seed: 760025
  horizon_steps: 300
  sampler: ddim5
bootstrap:
  confidence_level: 0.95
  n_resamples: 10000
  bootstrap_seed: 0
contrasts:
- - a0
  - a1
- - a1
  - a2
