# Issue #83 Task 1 candidate multi-seed confirmation protocol (E-056).
#
# Confirms the #106/E-055 nominated energy-band candidates (lambda = 4 and 8)
# against calibrated R0 across training seeds {0,1,2} for 100 updates under the
# frozen canonical contract: canonical k=5 (0.1 s x 5 = 0.5 s decision interval),
# the E-052 frozen PPO control overrides and the E-054 held-out evaluation
# contract. Only the energy-band weight lambda varies between trained arms;
# every other training/evaluation parameter is shared. gradient_diagnostics is
# enabled (measurement only) so the per-group actor/shared/value gradient
# diagnostics required by Issue #83 Task 1 are persisted.
version: 1
study_name: canonical_multiseed_confirmation
training:
  base_job: jobs/training/ppo_conservative
  maps:
  - S
  - SC
  map_seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  seeds:
  - 0
  - 1
  - 2
  overrides:
  - components/resources=rtx_a4000
  - ppo.target_kl=0.006
  - ppo.batch_size=128
  - training.transitions_per_environment=8
  - training.update_count=100
  - ppo.learning_rate=0.00015
  - ppo.epochs=1
  - ppo.max_gradient_norm=0.5
  - ppo.scheduler_total_optimizer_steps=100
  - ppo.value_coefficient=0.1
  - ppo.gamma=0.9509900499000001
  - ppo.gae_lambda=0.7737809375
  - ppo.gradient_diagnostics=true
arms:
  r0:
    label: ppo_plannerrft_r0_calibrated
    reward_profile: plannerrft_no_energy_calibrated_v1
  lam4:
    label: ppo_plannerrft_band_energy_lam4
    reward_profile: plannerrft_energy_band_lam4_v1
  lam8:
    label: ppo_plannerrft_band_energy_lam8
    reward_profile: plannerrft_energy_band_lam8_v1
evaluation:
  job: jobs/evaluation/no_traffic_heldout
  policy_job: jobs/evaluation/no_traffic_heldout_policy
  maps:
  - S
  - SC
  map_seeds:
  - 16
  - 17
  - 18
  - 19
  - 20
  - 21
  - 22
  - 23
  seed: 760025
  horizon_steps: 300
  sampler: ddim5
bootstrap:
  confidence_level: 0.95
  n_resamples: 10000
  bootstrap_seed: 0
contrasts:
- - r0
  - lam4
- - r0
  - lam8
