# @package reward

# Issue #94 Task G stress arm: the calibrated PlannerRFT objective with the
# energy component switched to the E-038 frozen calibrated efficiency-band
# representation (P10/P90 two-sided saturation, thresholds frozen from the
# E-038 fixed source batch) and the energy weight raised to lambda=64, the
# smallest stress lambda reaching >=50% of the R0 -> Energy-only gradient
# angular separation in E-038. E-038 measured the R0-vs-lambda64 actor-head
# cosine at 0.987113 with a 0.195312 sign-flip fraction under the actual PPO
# preprocessing. Provisional smoke-only MetaDrive adaptation; not
# PlannerRFT/nuPlan scorer parity and not a real-vehicle energy model.
name: plannerrft_energy_band_lam64_v1

weights:
  ttc: 5.0
  progress: 5.0
  comfort: 2.0
  speed: 4.0
  energy: 64.0

gates:
  collision_vehicle: true
  collision_object: true
  collision_building: true
  collision_human: true
  collision_sidewalk: true
  wrong_direction_max_heading_error_rad: 1.5707963267948966

ttc:
  critical_ttc_s: 1.0
  safe_ttc_s: 4.0
  maximum_ttc_s: 10.0
  minimum_closing_speed_mps: 0.1
  lateral_margin_m: 0.5
  longitudinal_margin_m: 0.5

progress:
  full_score_delta_m: 1.7813475926717124

comfort:
  longitudinal_acceleration_limit_mps2: 4.157548461641585
  lateral_acceleration_limit_mps2: 3.0
  jerk_limit_mps3: 111.70486995152065
  yaw_rate_limit_radps: 0.5

speed:
  overspeed_margin_mps: 0.0
  zero_score_overspeed_mps: 5.0

energy:
  mode: calibrated_band
  reference_ml_per_km: 50.0
  minimum_step_distance_m: 0.01
  band_full_score_ml_per_km: 46.37086372375488
  band_zero_score_ml_per_km: 48.7514030456543
