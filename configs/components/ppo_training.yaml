# @package _global_

defaults:
  - /components/env
  - /components/model
  - /components/runtime
  - /components/resources: null
  - /components/sampler: ddim5
  - /components/guidance: orthogonal_policy
  - /components/policy
  - /components/reward: plannerrft_energy_v1
  - /components/ppo
  - /components/tracking: mlflow
  - _self_

map_query_radius_m: 100.0

# Canonical closed-loop cadence (ADR 0039); pinned by ClosedLoopCadenceConfig
# so the resolved config states the execution contract explicitly and any
# non-canonical override fails at the typed boundary.
cadence:
  simulator_step_s: 0.1
  closed_loop_execution_steps: 5
  decision_interval_s: 0.5

training:
  update_count: 4
  transitions_per_environment: 16
  mode: no_traffic
  history_warmup_steps: 0
  replay_id: ???
  deterministic: true
  boundary_distance: 0.05
  boundary_sample_count: 4096
  diagnostic_seed: 300000
  planner_compile_mode: eager
  resume_checkpoint_path: null

env:
  horizon: 80

runtime:
  accelerator: cuda
  precision: bf16-mixed
  seed: ???

scenarios:
  - name: straight
    map: S
    seed: 0
  - name: gentle_curve
    map: SC
    seed: 0

hydra:
  job:
    chdir: false
