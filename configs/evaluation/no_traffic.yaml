# @package _global_

defaults:
  - /env: metadrive
  - /model: diffusion_planner
  - /runtime: fabric
  - _self_

name: official_no_traffic_closed_loop
map_query_radius_m: 100.0

evaluation:
  mode: no_traffic
  history_warmup_steps: 0
  evaluated_horizon_steps: 200

env:
  num_scenarios: 1
  use_render: false
  image_observation: false
  traffic_density: 0.0
  random_traffic: false
  random_spawn_lane_index: false
  accident_prob: 0.0
  physics_world_step_size: 0.02
  decision_repeat: 5
  trajectory_horizon: 80
  trajectory_execution_steps: 5
  programmatic_lane_speed_limit_kmh: 50.0
  horizon: 200

model:
  args_path: checkpoints/DP-Origin/args.json
  checkpoint_path: checkpoints/DP-Origin/model.pth

runtime:
  seed: 0

scenarios:
  - name: straight
    map: S
    seed: 0
  - name: gentle_curve
    map: SC
    seed: 0

video:
  enabled: true
  fps: 2
  screen_width: 800
  screen_height: 800
  film_width: 2000
  film_height: 2000
  scaling: 5.0

hydra:
  run:
    dir: outputs/no_traffic/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
