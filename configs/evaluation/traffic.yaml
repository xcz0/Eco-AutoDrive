# @package _global_

defaults:
  - /env: metadrive
  - /model: diffusion_planner
  - _self_

name: official_traffic_long_closed_loop
seed: 0
map_query_radius_m: 100.0

evaluation:
  mode: traffic
  history_warmup_steps: 20
  evaluated_horizon_steps: 3000

env:
  start_seed: 0
  num_scenarios: 5
  use_render: false
  image_observation: false
  traffic_density: 0.05
  traffic_mode: trigger
  random_traffic: false
  random_spawn_lane_index: false
  accident_prob: 0.0
  physics_world_step_size: 0.02
  decision_repeat: 5
  trajectory_horizon: 80
  trajectory_execution_steps: 5
  programmatic_lane_speed_limit_kmh: 50.0
  horizon: 3020

model:
  args_path: checkpoints/DP-Origin/args.json
  checkpoint_path: checkpoints/DP-Origin/model.pth
  device: cpu
  seed: ${seed}

scenarios:
  - name: long_straight
    map: SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS
    seed: ${seed}
  - name: long_mixed
    map: SCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSC
    seed: ${seed}

video:
  enabled: true
  fps: 2
  screen_width: 800
  screen_height: 800
  film_width: 2000
  film_height: 2000
  scaling: 5.0

hydra:
  run:
    dir: outputs/traffic/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/traffic/${now:%Y-%m-%d}/${now:%H-%M-%S}-long-seeds-0-4
    subdir: ${hydra.job.num}
  job:
    chdir: false
