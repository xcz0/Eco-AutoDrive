# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /planner/sampler: ddim5
  - /planner/guidance: orthogonal_policy
  - /rl/exploration_policy
  - _self_

name: plannerrft_rollout_smoke
map_query_radius_m: 100.0

rollout:
  mode: no_traffic
  max_transitions: 4
  history_warmup_steps: 0
  transition_dt_s: 0.1
  policy_action_seed: 1
  reward_source: metadrive_builtin_v1
  bootstrap_time_limit: true
  candidate_count: 1
  stopped_speed_threshold_mps: 0.1

env:
  trajectory_execution_steps: 1
  horizon: 4

runtime:
  seed: 0

scenario:
  name: straight
  map: S
  seed: 0
