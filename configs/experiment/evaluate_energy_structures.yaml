# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /resources: rtx3050_laptop
  - /runtime/evaluation_video
  - /planner/sampler: ddim5
  - /planner/guidance: none
  - _self_

name: energy_structures_closed_loop
map_query_radius_m: 100.0
evaluation:
  mode: no_traffic
  profile: energy_matrix
  history_warmup_steps: 0
  evaluated_horizon_steps: 300
  execution:
    mode: serial
    vector_env_slots: ${resources.evaluation_vector_env_slots}
    torch_threads_per_worker: ${resources.torch_threads_per_worker}
    deterministic: false
env:
  start_seed: 0
  num_scenarios: 6
  horizon: 300
  traffic_density: 0.0
  random_traffic: false
  random_agent_model: false
  accident_prob: 0.0
runtime: {seed: 0}
scenarios:
  - {name: cruise, map: SSS, seed: 0}
  - {name: curve, map: SCS, seed: 1}
  - {name: intersection, map: SXS, seed: 2}
  - {name: merge_lane_change, map: SyS, seed: 3}
video: {enabled: false}
hydra:
  run:
    dir: outputs/energy_matrix/structures/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
