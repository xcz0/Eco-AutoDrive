# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /resources: rtx3050_laptop
  - /planner/sampler: ddim5
  - /planner/guidance: orthogonal_policy
  - /rl/exploration_policy
  - /rl/reward
  - /rl: ppo_closed_loop_smoke
  - _self_

name: plannerrft_ppo_closed_loop_smoke
map_query_radius_m: 100.0

training:
  update_count: 4
  transitions_per_environment: 16
  replay_id: ???
  deterministic: true
  stopped_speed_threshold_mps: 0.1
  boundary_distance: 0.05
  boundary_sample_count: 4096
  diagnostic_seed: 300000
  resume_checkpoint_path: null

env:
  trajectory_execution_steps: 1
  horizon: 16
  driving_reward: ${reward.driving_reward}
  speed_reward: ${reward.speed_reward}
  success_reward: ${reward.success_reward}
  out_of_road_penalty: ${reward.out_of_road_penalty}
  crash_vehicle_penalty: ${reward.crash_vehicle_penalty}
  crash_object_penalty: ${reward.crash_object_penalty}
  crash_sidewalk_penalty: ${reward.crash_sidewalk_penalty}
  use_lateral_reward: ${reward.use_lateral_reward}

runtime:
  accelerator: cuda
  precision: bf16-mixed
  seed: ???

scenarios:
  - name: straight
    map: S
    seed: 0
  - name: gentle_curve
    map: SC
    seed: 0

hydra:
  run:
    dir: outputs/training/ppo/${now:%Y-%m-%d}/${now:%H-%M-%S}-seed-${runtime.seed}-replay-${training.replay_id}
  sweep:
    dir: outputs/training/ppo/${now:%Y-%m-%d}/${now:%H-%M-%S}-acceptance
    subdir: seed-${runtime.seed}-replay-${training.replay_id}
  job:
    chdir: false
