# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /resources: rtx3050_laptop
  - /runtime/evaluation_video
  - /planner/sampler: ddim5
  - /planner/guidance: none
  - _self_

name: energy_speed_limit_profile_closed_loop
map_query_radius_m: 100.0
evaluation:
  mode: no_traffic
  profile: energy_matrix
  history_warmup_steps: 0
  evaluated_horizon_steps: 300
  execution:
    mode: serial
    vector_env_slots: ${resources.evaluation_vector_env_slots}
    torch_threads_per_worker: ${resources.torch_threads_per_worker}
    deterministic: false
env:
  start_seed: 4
  num_scenarios: 1
  horizon: 300
  traffic_density: 0.0
  random_traffic: false
  random_agent_model: false
  accident_prob: 0.0
  programmatic_lane_speed_limit_profile_kmh: [50.0, 30.0, 50.0]
runtime: {seed: 0}
scenarios:
  - {name: speed_limit_50_30_50, map: SSS, seed: 4}
video: {enabled: false}
hydra:
  run:
    dir: outputs/energy_matrix/speed-profile/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
