# @package _global_

defaults:
  - /experiment/evaluate_traffic_full
  - override /hydra/launcher: joblib_two
  - _self_

evaluation:
  profile: matrix
  evaluated_horizon_steps: 300
  matrix:
    seeds: [0, 1, 2]
    traffic_densities: [0.05, 0.10]
  execution:
    mode: parallel
    vector_env_slots: null
    torch_threads_per_worker: 8
    deterministic: true

env:
  horizon: 320

video:
  enabled: false

hydra:
  sweep:
    dir: outputs/traffic/${now:%Y-%m-%d}/${now:%H-%M-%S}-matrix
    subdir: ${hydra.job.num}
  sweeper:
    params:
      runtime.seed: 0,1,2
      env.traffic_density: 0.05,0.10
