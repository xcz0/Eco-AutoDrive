# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /runtime/evaluation_video
  - /planner/sampler: dpm10
  - /planner/guidance: none
  - _self_

name: official_traffic_long_closed_loop
map_query_radius_m: 100.0

evaluation:
  mode: traffic
  profile: full
  history_warmup_steps: 20
  evaluated_horizon_steps: 3000
  execution:
    mode: serial
    torch_threads_per_worker: null
    deterministic: false

env:
  start_seed: 0
  num_scenarios: 5
  traffic_density: 0.05
  traffic_mode: trigger
  horizon: 3020

runtime:
  seed: 0

scenarios:
  - name: long_straight
    map: SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS
    seed: ${runtime.seed}
  - name: long_mixed
    map: SCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSC
    seed: ${runtime.seed}

hydra:
  run:
    dir: outputs/traffic/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/traffic/${now:%Y-%m-%d}/${now:%H-%M-%S}-long-seeds-0-4
    subdir: ${hydra.job.num}
  job:
    chdir: false
