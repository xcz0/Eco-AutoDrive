# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /runtime/evaluation_video
  - /planner/sampler: dpm10
  - /planner/guidance: none
  - /benchmark: throughput
  - _self_

name: reference_throughput_benchmark
map_query_radius_m: 100.0

evaluation:
  mode: no_traffic
  profile: throughput
  history_warmup_steps: 0
  evaluated_horizon_steps: 100
  execution:
    mode: serial
    vector_env_slots: null
    torch_threads_per_worker: null
    deterministic: false

env:
  start_seed: 0
  num_scenarios: 8
  horizon: 100

runtime:
  seed: 0

scenarios:
  - name: straight
    map: S
    seed: 0

video:
  enabled: false

hydra:
  run:
    dir: outputs/benchmarks/reference/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
