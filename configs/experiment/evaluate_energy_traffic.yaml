# @package _global_

defaults:
  - /env: metadrive
  - /planner/model
  - /runtime: fabric
  - /resources: rtx3050_laptop
  - /runtime/evaluation_video
  - /planner/sampler: ddim5
  - /planner/guidance: none
  - _self_

name: energy_low_density_traffic_closed_loop
map_query_radius_m: 100.0
evaluation:
  mode: traffic
  profile: energy_matrix
  history_warmup_steps: 20
  evaluated_horizon_steps: 600
  execution:
    mode: serial
    vector_env_slots: ${resources.evaluation_vector_env_slots}
    torch_threads_per_worker: ${resources.torch_threads_per_worker}
    deterministic: false
env:
  start_seed: 5
  num_scenarios: 1
  horizon: 620
  traffic_density: 0.05
  traffic_mode: trigger
  random_traffic: false
  random_agent_model: false
  accident_prob: 0.0
runtime: {seed: 0}
scenarios:
  - {name: traffic_follow, map: SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS, seed: 5}
video: {enabled: false}
hydra:
  run:
    dir: outputs/energy_matrix/traffic/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
