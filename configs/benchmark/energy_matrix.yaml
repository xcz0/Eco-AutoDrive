version: 1
planner_noise_seed: 0

execution:
  simulator_hz: 10
  planner_hz: 2
  physics_world_step_size_s: 0.02
  decision_repeat: 5
  trajectory_execution_steps: 5

energy_metric:
  name: metadrive_episode_energy
  implementation: recompute_metadrive_base_vehicle_formula_on_executed_trace
  reference_info_fields: [step_energy, episode_energy]
  unit: mL
  formula: 3.25 * exp(0.01 * speed_kmh) * distance_km / 100 * 1000
  interpretation: MetaDrive fuel-consumption proxy
  accumulation_boundary: environment reset to episode termination or horizon
  sampling_interval_s: 0.1

vehicle_config:
  random_agent_model: false
  wheel_friction: 0.9
  max_engine_force: 800
  max_brake_force: 150
  max_steering: 40
  max_speed_km_h: 80

traffic_profiles:
  none:
    density: 0.0
    random_traffic: false
    accident_prob: 0.0
  low_density:
    density: 0.05
    traffic_mode: trigger
    random_traffic: false
    accident_prob: 0.0
    history_warmup_steps: 20

guidance_profiles:
  - id: none
    config: none
    longitudinal_scale: null
  - id: longitudinal_negative
    config: energy_longitudinal_negative
    longitudinal_scale: -1.0
  - id: longitudinal_zero
    config: energy_longitudinal_zero
    longitudinal_scale: 0.0
  - id: longitudinal_positive
    config: energy_longitudinal_positive
    longitudinal_scale: 1.0

jobs:
  - id: structures
    experiment: experiment/evaluate_energy_structures
    traffic_profile: none
    speed_limit_kmh: 50.0
    scenarios:
      - name: straight_cruise
        map: SSS
        seed: 0
        map_features: [straight, cruise]
        nominal_termination: arrive_dest_or_time_truncation
        energy_metric: metadrive_episode_energy
      - name: curve
        map: SCS
        seed: 0
        map_features: [straight, curve]
        nominal_termination: arrive_dest_or_time_truncation
        energy_metric: metadrive_episode_energy
      - name: intersection
        map: SXS
        seed: 0
        map_features: [straight, intersection]
        nominal_termination: arrive_dest_or_time_truncation
        energy_metric: metadrive_episode_energy
      - name: merge_lane_change
        map: SyS
        seed: 0
        map_features: [straight, merge, lane_change]
        nominal_termination: arrive_dest_or_time_truncation
        energy_metric: metadrive_episode_energy
  - id: speed_limit_30
    experiment: experiment/evaluate_energy_speed_30
    traffic_profile: none
    speed_limit_kmh: 30.0
    scenarios:
      - name: speed_limit_30
        map: SSS
        seed: 0
        map_features: [straight, cruise, speed_limit_30_kmh]
        nominal_termination: arrive_dest_or_time_truncation
        energy_metric: metadrive_episode_energy
  - id: speed_limit_50
    experiment: experiment/evaluate_energy_speed_50
    traffic_profile: none
    speed_limit_kmh: 50.0
    scenarios:
      - name: speed_limit_50
        map: SSS
        seed: 0
        map_features: [straight, cruise, speed_limit_50_kmh]
        nominal_termination: arrive_dest_or_time_truncation
        energy_metric: metadrive_episode_energy
  - id: low_density_traffic
    experiment: experiment/evaluate_energy_traffic
    traffic_profile: low_density
    speed_limit_kmh: 50.0
    scenarios:
      - name: low_density_mixed
        map: SCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSCSC
        seed: 0
        map_features: [straight, curve, low_density_traffic]
        nominal_termination: time_truncation_or_driving_termination
        energy_metric: metadrive_episode_energy
