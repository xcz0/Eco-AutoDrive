minimum_pre_commit_version: "4.6.2"

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/Scripts/ruff.exe check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: .venv/Scripts/ruff.exe format --force-exclude
        language: unsupported
        types_or: [python, pyi]

      - id: pyright
        name: pyright
        entry: .venv/Scripts/pyright.exe
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
